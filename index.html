<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSmart – Become Smarter Every Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@500;700;800&family=Reddit+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#172033;--mute:#5d6a82;--line:#d9e0ec;--pri:#2f5bea;--priInk:#fff;--soft:#e4ebff;--ok:#1f9d6b;--warn:#c77a00;--bad:#d64545;--badSoft:#fdeaea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#18203a;--ink:#e8edf8;--mute:#9aa7c2;--line:#2a3558;--pri:#7c9bff;--priInk:#0f1524;--soft:#222d55;--ok:#4cc99a;--warn:#f0b04a;--bad:#ff8080;--badSoft:#3a2330;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#18203a;--ink:#e8edf8;--mute:#9aa7c2;--line:#2a3558;--pri:#7c9bff;--priInk:#0f1524;--soft:#222d55;--ok:#4cc99a;--warn:#f0b04a;--bad:#ff8080;--badSoft:#3a2330;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;line-height:1.15}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:auto;padding:12px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px}.brand h1{font-size:26px;font-weight:800}.brand span{color:var(--mute);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
nav a{white-space:nowrap;text-decoration:none;color:var(--mute);padding:7px 13px;border-radius:99px;font-weight:600;font-size:14px;border:1px solid transparent}
nav a.on{background:var(--pri);color:var(--priInk)}
nav a.med.on{background:var(--bad);color:#fff}
main{max-width:980px;margin:auto;padding:20px 16px 60px}
.hero{font-size:clamp(26px,5vw,40px);font-weight:800;max-width:18ch}
.sub{color:var(--mute);margin:8px 0 20px;max-width:60ch}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:18px;margin-bottom:10px}
.stat b{display:block;font:800 30px 'Bricolage Grotesque',sans-serif}.stat small{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row .g{flex:1;min-width:0;overflow-wrap:anywhere}
.done .g{text-decoration:line-through;color:var(--mute)}
.add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input[type=text],textarea{flex:1;min-width:120px}textarea{width:100%;min-height:80px}
input[type=range]{padding:0;accent-color:var(--pri)}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:9px;padding:8px 14px;background:var(--pri);color:var(--priInk)}
button.ghost{background:var(--soft);color:var(--ink)}button.x{background:none;color:var(--mute);padding:4px 8px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--soft)}
.tag.h{background:var(--badSoft);color:var(--bad)}.tag.ok{color:var(--ok)}.tag.w{color:var(--warn)}
.muted{color:var(--mute);font-size:14px}
.timer{font:800 56px 'Bricolage Grotesque',sans-serif;text-align:center;margin:6px 0}
.bar2{height:8px;border-radius:9px;background:var(--soft);overflow:hidden}.bar2>i{display:block;height:100%;background:var(--pri)}
.alert{background:var(--badSoft);border:1px solid var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.alert b{color:var(--bad)}
a.btn{display:inline-block;text-decoration:none;background:var(--bad);color:#fff;font-weight:600;padding:9px 14px;border-radius:9px;margin-top:8px}
ol,ul{margin:6px 0 0;padding-left:20px}li{margin:3px 0}
.click{cursor:pointer;text-align:left}.click:hover{border-color:var(--pri)}
@media (prefers-reduced-motion:no-preference){.bar2>i{transition:width .3s}}
body{font-family:'Reddit Sans',system-ui,sans-serif;--c-study:#00b0f0;--c-life:#ff8420;--c-career:#4289e1;--c-think:#b548c0;--c-growth:#209c91;--c-medical:#d64545}
h1,h2,h3,.timer,.stat b{font-family:Parkinsans,'Reddit Sans',sans-serif}
body[data-v=home],body[data-v=career]{--pri:#4289e1;--priInk:#0b1330}
body[data-v=study]{--pri:#00b0f0;--priInk:#0b1330}
body[data-v=life]{--pri:#ff8420;--priInk:#0b1330}
body[data-v=think]{--pri:#b548c0;--priInk:#fff}
body[data-v=growth]{--pri:#209c91;--priInk:#0b1330}
body[data-v=medical]{--pri:#d64545;--priInk:#fff}
header{background:#101a3a;border-bottom:0}
.brand h1{color:#fff}.brand h1::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#ff8420;margin-right:8px}.brand span{color:#b8c2df}
header nav a{color:#b8c2df}header nav a.on{color:var(--priInk)}header nav a.med.on{color:#fff}
.card{border-radius:18px}
.banner{position:relative;overflow:hidden;border-radius:22px;padding:34px 26px;margin-bottom:22px;color:#fff;background:radial-gradient(circle at 92% 8%,#00b0f066,transparent 42%),radial-gradient(circle at 8% 100%,#ff842055,transparent 45%),radial-gradient(circle at 60% 120%,#b548c044,transparent 45%),#101a3a}
.banner small{color:#ff8420;font-weight:600;font-size:15px}
.banner h2{font-size:clamp(32px,7vw,56px);font-weight:800;margin:8px 0 10px;max-width:14ch}
.banner p{color:#b8c2df;max-width:46ch;margin:0 0 18px}
.banner button{background:#ff8420;color:#101a3a;padding:11px 20px;border-radius:99px}
.hero{position:relative;padding-left:16px}.hero::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:6px;border-radius:9px;background:var(--pri)}
.stat{border-top:5px solid var(--c-study)}.stat:nth-child(2){border-color:var(--c-life)}.stat:nth-child(3){border-color:var(--c-think)}.stat:nth-child(4){border-color:var(--c-growth)}
.card.click{border-top:5px solid var(--cc,var(--pri));font:inherit;color:inherit;width:100%}
.card.click h3{color:var(--ink)}
.tag.w{background:#ff842022}
.banner img{position:absolute;right:20px;bottom:0;height:min(88%,270px)}
.banner>*:not(img){position:relative}
.ic{display:block;width:42px;height:42px;margin-bottom:10px}
@media(max-width:560px){.banner img{opacity:.22;right:0}}
:root{--sh:0 1px 2px rgba(16,26,58,.06),0 10px 28px -14px rgba(16,26,58,.22)}
body{line-height:1.6}
.bar,main,footer{max-width:1120px}.bar{padding:14px 20px 0}main{padding:30px 20px 64px}
header{background:rgba(16,26,58,.97);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(255,255,255,.07)}
.brand{gap:12px;align-items:center}.brand h1{font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand h1::before{content:"B";display:grid;place-items:center;width:34px;height:34px;margin:0;border-radius:10px;font-size:19px;color:#101a3a;background:linear-gradient(135deg,#00b0f0,#4289e1 55%,#ff8420)}
nav{gap:4px;padding:12px 0 14px}header nav a{padding:8px 15px;border-radius:12px;transition:background .15s,color .15s}header nav a:not(.on):hover{background:rgba(255,255,255,.09);color:#fff}
.card{border-radius:20px;padding:20px;box-shadow:var(--sh)}.card h3{font-size:19px;letter-spacing:-.01em}
.card.click{text-align:left;transition:transform .18s,box-shadow .18s}.card.click:hover{transform:translateY(-3px);box-shadow:0 16px 34px -14px rgba(16,26,58,.4)}.card.click .muted{display:block;line-height:1.5;margin-top:6px}
#app>h3{font-size:22px;letter-spacing:-.02em}
.hero{display:flex;align-items:center;gap:14px;padding-left:0;max-width:none;font-size:clamp(26px,4.4vw,38px);letter-spacing:-.025em}.hero::before{display:none}
.hi,.ic{flex:none;border-radius:16px;background:color-mix(in srgb,var(--cc,var(--pri)) 16%,var(--card))}.hi{width:54px;height:54px;padding:10px}.ic{width:52px;height:52px;padding:10px;margin-bottom:14px}
.sub{font-size:17px;margin:10px 0 26px;max-width:62ch}
.stat{padding:20px 22px}.stat b{font-size:40px;letter-spacing:-.03em}.stat small{font-size:14px;font-weight:500}
.banner{padding:clamp(28px,5vw,54px);border-radius:28px;box-shadow:0 26px 50px -28px rgba(16,26,58,.75)}
.banner h2{font-size:clamp(34px,6.4vw,64px);letter-spacing:-.03em;line-height:1.05;max-width:12ch}.banner p{font-size:18px}
.banner button{font-size:16px;padding:13px 26px;box-shadow:0 10px 22px -10px #ff8420}.banner img{height:min(92%,330px);right:4%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.chips span{font-size:13px;font-weight:500;color:#dbe3f7;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:99px;padding:5px 12px}
.row{padding:11px 0}
input,select,textarea{border-radius:11px;padding:10px 12px}input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:3px solid color-mix(in srgb,var(--pri) 30%,transparent);outline-offset:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri);flex:none}
button{border-radius:11px;padding:10px 16px;transition:filter .15s,transform .1s}button:hover{filter:brightness(1.08)}button:active{transform:translateY(1px)}
.tag{padding:3px 10px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}details[open]{border-color:var(--pri)}summary{cursor:pointer}
.alert{border-radius:16px;border-left:6px solid var(--bad);padding:16px 18px}
footer{margin:0 auto;padding:22px 20px 30px;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}footer b{color:var(--ink)}
a.brand{text-decoration:none;color:inherit}.back{margin-bottom:18px;padding:8px 14px}
.brand h1::before{display:none}.lg{width:36px;height:36px;border-radius:10px;display:block}
</style>
</head>

 '<div class="card"><h3>Focus timer</h3><div class="timer" id="tmr">'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'</div><div class="add" style="justify-content:center"><button onclick="tStart()">'+(tm?'Pause':'Start 25 min')+'</button><button class="ghost" onclick="tReset()">Reset</button></div><p class="muted" style="text-align:center">Studied today: <b>'+(S.mins[T]||0)+' min</b></p></div></div>';
};
function addTopic(){var t=v('tp');if(!t)return;S.topics.push({t:t,last:T,step:0});save();render()}
function rev(i){S.topics[i].last=T;S.topics[i].step++;save();render()}
function delTopic(i){S.topics.splice(i,1);save();render()}
function tStart(){if(tm){clearInterval(tm);tm=null;render();return}tm=setInterval(function(){left--;if(left<=0){clearInterval(tm);tm=null;left=1500;S.mins[T]=(S.mins[T]||0)+25;save();if(view==='study')render();alert('Session complete! +25 minutes logged.');return}var e=document.getElementById('tmr');if(e)e.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')},1000);render()}
function tReset(){clearInterval(tm);tm=null;left=1500;render()}
/* LIFE */
V.life=function(){
 var ord={H:0,M:1,L:2},tk=S.tasks.map(function(t,i){return{t:t,i:i}}).sort(function(a,b){return a.t.done-b.t.done||ord[a.t.p]-ord[b.t.p]});
 return '<h2 class="hero">Smart Life & Productivity</h2><p class="sub">Decide what matters, then do it. Tasks with a time act as your daily reminder list.</p><div class="grid">'+
 '<div class="card"><h3>Tasks</h3>'+(tk.length?tk.map(function(o){var t=o.t;return '<div class="row '+(t.done?'done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' aria-label="Done" onchange="tog('+o.i+')"><span class="g">'+esc(t.t)+(t.time?' <small class="muted">⏰ '+esc(t.time)+'</small>':'')+'</span><span class="tag '+(t.p==='H'?'h':'')+'">'+{H:'High',M:'Medium',L:'Low'}[t.p]+'</span><button class="x" aria-label="Delete" onclick="delTask('+o.i+')">✕</button></div>'}).join(''):'<p class="muted">No tasks yet.</p>')+'<div class="add"><input type="text" id="tk" placeholder="New task" data-go="addTask"><select id="tpri"><option value="H">High</option><option value="M" selected>Medium</option><option value="L">Low</option></select><input type="time" id="ttm" aria-label="Time"><button onclick="addTask()">Add</button></div></div>'+
 '<div class="card"><h3>Daily routine</h3>'+S.routine.map(function(r,i){var d=r.d===T;return '<div class="row '+(d?'done':'')+'"><input type="checkbox" '+(d?'checked':'')+' aria-label="Done" onchange="rt('+i+')"><span class="g">'+esc(r.n)+'</span></div>'}).join('')+'<div class="add"><input type="text" id="rtn" placeholder="Add routine step" data-go="addRt"><button onclick="addRt()">Add</button></div><p class="muted">Routine resets every day.</p></div></div>';
};
function addTask(){var t=v('tk');if(!t)return;var p=document.getElementById('tpri').value,tt=document.getElementById('ttm').value;S.tasks.push({t:t,p:p,time:tt,done:false});save();render()}
function tog(i){S.tasks[i].done=!S.tasks[i].done;save();render()}
function delTask(i){S.tasks.splice(i,1);save();render()}
function rt(i){S.routine[i].d=S.routine[i].d===T?'':T;save();render()}
function addRt(){var t=v('rtn');if(!t)return;S.routine.push({n:t,d:''});save();render()}

V.career=function(){
 var k=SK[dayN()%SK.length];
 return '<h2 class="hero">Career, Digital & Communication Skills</h2><p class="sub">Rate yourself honestly, then practise the lowest skill first.</p><div class="grid">'+
 '<div class="card"><h3>Skill levels</h3>'+SK.map(function(s){var l=S.skills[s[0]]||0;return '<div style="margin:10px 0"><div class="row" style="border:0;padding:0"><span class="g">'+s[0]+'</span><b>'+l+'/5</b></div><input type="range" min="0" max="5" value="'+l+'" style="width:100%" aria-label="'+s[0]+' level" onchange="sk(\''+s[0]+'\',this.value)"></div>'}).join('')+'</div>'+
 '<div class="card"><h3>Today’s practice: '+k[0]+'</h3><p>'+k[1]+'</p><p class="muted">A new skill comes up each day.</p><h3 style="margin-top:18px">Job-ready checklist</h3>'+JOB.map(function(j,i){var d=S.jobs[i];return '<div class="row '+(d?'done':'')+'"><input type="checkbox" '+(d?'checked':'')+' aria-label="'+esc(j)+'" onchange="jb('+i+')"><span class="g">'+j+'</span></div>'}).join('')+bar(pct(Object.keys(S.jobs).filter(function(k){return S.jobs[k]}).length,JOB.length))+'</div></div>';

 var p=0,c=0;S.dec.forEach(function(d){d.s==='p'?p+=d.w:c+=d.w});

 '<div class="card"><h3>Decision helper</h3><div class="add" style="margin:0 0 8px"><input type="text" id="dt" placeholder="A pro or a con" data-go="addDec"><select id="ds"><option value="p">Pro</option><option value="c">Con</option></select><select id="dw" aria-label="Weight"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select><button onclick="addDec()">Add</button></div><p class="muted">Weight 1 = minor, 5 = critical.</p>'+S.dec.map(function(d,i){return '<div class="row"><span class="tag '+(d.s==='p'?'ok':'h')+'">'+(d.s==='p'?'Pro':'Con')+' '+d.w+'</span><span class="g">'+esc(d.t)+'</span><button class="x" aria-label="Delete" onclick="delDec('+i+')">✕</button></div>'}).join('')+'<p><b>'+verdict+'</b> <span class="muted">(pros '+p+' · cons '+c+')</span></p>'+(S.dec.length?'<button class="ghost" onclick="S.dec=[];save();render()">Clear</button>':'')+'</div></div>';
};
function addDec(){var t=v('dt');if(!t)return;S.dec.push({t:t,s:document.getElementById('ds').value,w:+document.getElementById('dw').value});save();render()}
function delDec(i){S.dec.splice(i,1);save();render()}
/* GROWTH */
V.growth=function(){
 return '<h2 class="hero">Personal Growth</h2><p class="sub">Set goals, build habits, and reflect on how you are doing.</p><div class="grid">'+
 '<div class="card"><h3>Goals</h3>'+(S.goals.length?S.goals.map(function(g,i){return '<div style="margin:10px 0"><div class="row" style="border:0;padding:0"><span class="g">'+esc(g.t)+'</span><b>'+g.p+'%</b><button class="x" aria-label="Delete" onclick="S.goals.splice('+i+',1);save();render()">✕</button></div><input type="range" min="0" max="100" step="5" value="'+g.p+'" style="width:100%" aria-label="Progress" onchange="gp('+i+',this.value)"></div>'}).join(''):'<p class="muted">No goals yet. What do you want to reach?</p>')+'<div class="add"><input type="text" id="gl" placeholder="e.g. Finish IELTS prep" data-go="addGoal"><button onclick="addGoal()">Add goal</button></div></div>'+
 '<div class="card"><h3>Habits</h3>'+(S.habits.length?S.habits.map(function(h,i){var d=h.days.indexOf(T)>-1;return '<div class="row '+(d?'done':'')+'"><input type="checkbox" '+(d?'checked':'')+' aria-label="Done today" onchange="hb('+i+')"><span class="g">'+esc(h.n)+'</span><span class="tag w">'+streak(h)+' day streak</span><button class="x" aria-label="Delete" onclick="S.habits.splice('+i+',1);save();render()">✕</button></div>'}).join(''):'<p class="muted">No habits yet.</p>')+'<div class="add"><input type="text" id="hn" placeholder="e.g. Read 10 pages" data-go="addHab"><button onclick="addHab()">Add habit</button></div></div>'+
 '<div class="card" style="grid-column:1/-1"><h3>Reflection</h3><textarea id="jr" placeholder="How was today? What went well? What will you change tomorrow?"></textarea><div class="add"><select id="jm" aria-label="Mood"><option>😊 Good</option><option>😐 Okay</option><option>😔 Low</option></select><button onclick="addJ()">Save entry</button></div>'+S.journal.slice().reverse().slice(0,5).map(function(j){return '<div class="row"><span class="g"><small class="muted">'+j.d+' · '+j.m+'</small><br>'+esc(j.t)+'</span></div>'}).join('')+'</div></div>';
};
function addGoal(){var t=v('gl');if(!t)return;S.goals.push({t:t,p:0});save();render()}
function gp(i,x){S.goals[i].p=+x;save();render()}
function addHab(){var t=v('hn');if(!t)return;S.habits.push({n:t,days:[]});save();render()}
function hb(i){var h=S.habits[i],k=h.days.indexOf(T);k>-1?h.days.splice(k,1):h.days.push(T);save();render()}
function addJ(){var t=v('jr');if(!t)return;S.journal.push({d:T,m:document.getElementById('jm').value,t:t});save();render()}
/* MEDICAL */
var FA=[['Severe bleeding',['Press firmly on the wound with a clean cloth.','Keep pressing. Add more cloth on top if it soaks through.','Raise the injured limb if you can.','Get emergency help for heavy bleeding.']],['Burns',['Cool the burn under running cool water for about 20 minutes.','Remove rings or tight items near the burn.','Cover loosely with a clean non-fluffy cloth.','No ice, butter or toothpaste. Get help for large burns, or burns on the face or hands.']],['Choking (adult, conscious)',['Encourage them to keep coughing.','If they cannot cough or breathe: give 5 firm back blows between the shoulder blades.','Then 5 abdominal thrusts. Alternate until clear.','If they collapse, call for help and start CPR.']],['CPR (adult, not breathing)',['Call 999 or ask someone to call.','Push hard and fast in the centre of the chest, about 100–120 per minute.','Let the chest rise fully between pushes.','Continue until help arrives or the person recovers.']],['Fainting',['Lay the person flat and raise their legs.','Loosen tight clothing and give fresh air.','Do not give food or drink until fully awake.','Get help if they do not wake quickly.']]];
var SY=[['Emergency now',['Chest pain or pressure','Severe difficulty breathing','Face droop, arm weakness or slurred speech (possible stroke)','Seizure, confusion or unconsciousness','Heavy bleeding that will not stop']],['See a doctor soon',['Fever lasting more than 3 days','Vomiting or diarrhoea with signs of dehydration','Pain that is getting worse','Symptoms in infants, older people or pregnancy']],['Often manageable at home',['Mild cold or sore throat: rest and fluids','Mild diarrhoea: oral rehydration solution (ORS)','Minor cuts: wash and cover','Mild headache: rest and water']]];
var MS=['Read the label and check the expiry date.','Never exceed the dose on the label or from your doctor.','Do not take antibiotics without a prescription.','Tell the doctor or pharmacist about allergies and other medicines.','Keep all medicines out of children’s reach.','Do not share prescription medicines.'];
V.medical=function(){
 return '<h2 class="hero">Primary Medical Help</h2><p class="sub">Quick guidance for first aid, early symptoms and medicine safety.</p><div class="alert"><b>In an emergency call 999 (Bangladesh).</b> This page is general guidance only. It does not replace a doctor.<br><a class="btn" href="https://www.google.com/maps/search/hospitals+near+me" target="_blank" rel="noopener">Find nearby hospitals</a></div><div class="grid">'+
 '<div class="card"><h3>First aid</h3>'+FA.map(function(f){return '<details style="margin:8px 0"><summary><b>'+f[0]+'</b></summary><ol>'+f[1].map(function(s){return '<li>'+s+'</li>'}).join('')+'</ol></details>'}).join('')+'</div>'+
 '<div class="card"><h3>Symptom guide</h3>'+SY.map(function(s,i){return '<p style="margin:10px 0 0"><span class="tag '+(i===0?'h':i===1?'w':'ok')+'">'+s[0]+'</span></p><ul>'+s[1].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'}).join('')+'</div>'+
 '<div class="card"><h3>Medicine safety</h3><ul>'+MS.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div></div>';
};
render();
</script>
<!-- BSmart AI চ্যাট উইজেট
     ব্যবহার: এই পুরো কোড আপনার index.html-এর </body> ট্যাগের ঠিক আগে পেস্ট করুন।
     নিচের WORKER_URL-এ আপনার Cloudflare Worker-এর লিংক বসান। -->

<style>
  :root {
    --bs-ink: #14213d;
    --bs-accent: #1f7a8c;
    --bs-bg: #ffffff;
    --bs-soft: #eef3f6;
    --bs-text: #1b1f27;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bs-bg: #182030; --bs-soft: #232d42; --bs-text: #eef1f6; --bs-accent: #4fb3c4; }
  }
  #bs-fab {
    position: fixed; right: 16px; bottom: 16px; z-index: 9998;
    width: 56px; height: 56px; border: 0; border-radius: 50%;
    background: var(--bs-accent); color: #fff; font-size: 24px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  #bs-fab:focus-visible, #bs-send:focus-visible, #bs-input:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
  #bs-panel {
    position: fixed; right: 16px; bottom: 84px; z-index: 9999;
    width: min(380px, calc(100vw - 32px)); height: min(520px, calc(100vh - 110px));
    display: none; flex-direction: column; overflow: hidden;
    background: var(--bs-bg); color: var(--bs-text);
    border-radius: 14px; box-shadow: 0 10px 34px rgba(0,0,0,.3);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", sans-serif;
  }
  #bs-panel.open { display: flex; }
  #bs-head { background: var(--bs-ink); color: #fff; padding: 12px 16px; font-weight: 600; }
  #bs-head small { display: block; font-weight: 400; opacity: .75; font-size: 12px; margin-top: 2px; }
  #bs-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .bs-msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .bs-me { align-self: flex-end; background: var(--bs-accent); color: #fff; border-bottom-right-radius: 4px; }
  .bs-ai { align-self: flex-start; background: var(--bs-soft); border-bottom-left-radius: 4px; }
  .bs-err { align-self: flex-start; background: #fde8e8; color: #8a1c1c; }
  #bs-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--bs-soft); }
  #bs-input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #b9c4cc; background: var(--bs-bg); color: var(--bs-text); font-size: 16px; }
  #bs-send { padding: 0 16px; border: 0; border-radius: 10px; background: var(--bs-ink); color: #fff; font-weight: 600; cursor: pointer; }
  #bs-send:disabled { opacity: .5; cursor: not-allowed; }
  #bs-note { font-size: 11px; opacity: .65; padding: 0 12px 8px; }
</style>

<button id="bs-fab" aria-label="BSmart AI চ্যাট খুলুন" aria-expanded="false">💬</button>

<section id="bs-panel" role="dialog" aria-label="BSmart AI সহকারী">
  <div id="bs-head">BSmart সহকারী<small>প্রশ্ন করুন, আরও স্মার্ট হোন</small></div>
  <div id="bs-log" aria-live="polite"></div>
  <div id="bs-note">AI ভুল করতে পারে। ব্যক্তিগত তথ্য বা পাসওয়ার্ড লিখবেন না।</div>
  <div id="bs-form">
    <input id="bs-input" type="text" maxlength="500" placeholder="আপনার প্রশ্ন লিখুন" autocomplete="off" />
    <button id="bs-send" type="button">পাঠান</button>
  </div>
</section>

<script>
  // এখানে আপনার Worker-এর লিংক বসান
const WORKER_URL = "https://bsmart-ai.mdnurujjamannahid76.workers.dev";

  const fab = document.getElementById("bs-fab");
  const panel = document.getElementById("bs-panel");
  const log = document.getElementById("bs-log");
  const input = document.getElementById("bs-input");
  const sendBtn = document.getElementById("bs-send");

  function addMsg(text, cls) {
    const d = document.createElement("div");
    d.className = "bs-msg " + cls;
    d.textContent = text; // textContent: নিরাপদ, HTML ইনজেকশন হয় না
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  fab.addEventListener("click", () => {
    const open = panel.classList.toggle("open");
    fab.setAttribute("aria-expanded", open);
    if (open) {
      if (!log.children.length) addMsg("হ্যালো! আমি BSmart সহকারী। আজ কীভাবে সাহায্য করতে পারি?", "bs-ai");
      input.focus();
    }
  });

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    addMsg(text, "bs-me");
    input.value = "";
    sendBtn.disabled = true;
    const wait = addMsg("ভাবছি…", "bs-ai");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      wait.remove();
if (data.answer) addMsg(data.answer, "bs-ai");
else addMsg(data.error || "কিছু একটা সমস্যা হয়েছে।", "bs-err");
    } catch (e) {
      wait.remove();
      addMsg("ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন।", "bs-err");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
